<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" role="img" aria-label="Perikrone logo">
  <defs>
    <radialGradient id="planet2" cx="38%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#9af1f7"/>
      <stop offset="45%" stop-color="#48cfe6"/>
      <stop offset="100%" stop-color="#1f8bab"/>
    </radialGradient>
    <linearGradient id="ring2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="55%" stop-color="#e3b23c"/>
      <stop offset="100%" stop-color="#b9882a"/>
    </linearGradient>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1426"/>
      <stop offset="100%" stop-color="#080d18"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38c6e0" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#38c6e0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow2" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="420" rx="34" fill="url(#bg2)"/>
  <circle cx="250" cy="210" r="210" fill="url(#halo)"/>

  <!-- mark -->
  <g transform="translate(90,30) scale(0.9)">
    <ellipse cx="200" cy="205" rx="178" ry="66" transform="rotate(-18 200 205)"
      fill="none" stroke="#38c6e0" stroke-opacity=".35" stroke-width="2" stroke-dasharray="3 7"/>
    <ellipse cx="200" cy="200" rx="156" ry="52" transform="rotate(-18 200 200)"
      fill="none" stroke="url(#ring2)" stroke-width="12" stroke-opacity=".55"/>
    <circle cx="200" cy="200" r="74" fill="url(#planet2)"/>
    <circle cx="200" cy="200" r="74" fill="none" stroke="#bff3f9" stroke-opacity=".35" stroke-width="1.5"/>
    <ellipse cx="200" cy="200" rx="156" ry="52" transform="rotate(-18 200 200)"
      fill="none" stroke="url(#ring2)" stroke-width="12" stroke-linecap="round"
      stroke-dasharray="120 360" stroke-dashoffset="372"/>
    <circle cx="54" cy="250" r="12" fill="#eafcff" filter="url(#glow2)"/>
    <circle cx="54" cy="250" r="5.5" fill="#38c6e0"/>
  </g>

  <!-- wordmark -->
  <text x="468" y="213" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="112" font-weight="700" letter-spacing="7" fill="#ffffff">PERIKRONE</text>
  <text x="472" y="272" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
    font-size="32" font-weight="500" letter-spacing="6.5" fill="#9fb1c6">CLOSEST-POINT SECURITY</text>
</svg>
